name: Combo checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python skills/combo/tools/project_kb.py check
      - run: python scripts/sync-context-core.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s evals/outcome-first -p 'test_*.py' -v
